name: Checks / 代码检查

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: 11.28.5
          run_install: false
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm run check
      - run: node scripts/check-public.js --tracked
      - run: pnpm test
      - run: pnpm pack --pack-destination .work/ci-pack
